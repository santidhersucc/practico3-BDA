# Sentinel: MongoDB (replica set de un nodo) + API.
#   Iniciar:  docker compose up -d --build
#   Detener:  docker compose down        (los datos se conservan en el volumen)
#   Borrar datos:  docker compose down -v
# Variables: ver .env.example (todas tienen valor por defecto).
services:
  mongo:
    image: mongo:7.0
    container_name: sentinel-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
      - ./consultas:/consultas:ro        # para ejecutar los .js con mongosh dentro del contenedor
    healthcheck:
      # Inicializa el replica set la primera vez y luego confirma que hay primario
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  api:
    build: .
    container_name: sentinel-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy       # la API arranca cuando el replica set ya tiene primario
    environment:
      # Dentro de Compose MongoDB se llama "mongo" (nombre del servicio), no localhost
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB: ${MONGO_DB:-sentinel}
      ANIO_NUMERACION: ${ANIO_NUMERACION:-2026}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

volumes:
  mongo_data:
    name: sentinel_mongo_data
