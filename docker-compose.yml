services:
  mongo:
    image: mongo:7.0
    container_name: sentinel-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Inicializa el replica set la primera vez y luego confirma que hay primario
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo_data:
    name: sentinel_mongo_data